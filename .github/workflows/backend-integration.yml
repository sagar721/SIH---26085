name: Backend integration

on:
  push:
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  compose-celery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start PostGIS, Redis, API and Celery
        run: |
          pip install -r requirements.txt
          python - <<'PY' > .env
          from app.core.auth import hash_password
          print("POSTGRES_PASSWORD=ci-postgres-password")
          print("JWT_SECRET_KEY=ci-jwt-secret-at-least-32-bytes-long")
          print("AUTH_ADMIN_USERNAME=ci-admin")
          print(f"AUTH_ADMIN_PASSWORD_HASH={hash_password('ci-admin-password')}")
          PY
          docker compose up -d --build
      - name: Apply migrations and verify readiness
        run: |
          docker compose exec -T backend alembic upgrade head
          for i in {1..30}; do curl --fail http://localhost:8000/api/v1/health/ready && break || sleep 2; done
      - name: Exercise Redis/Celery simulation path
        run: |
          TOKEN=$(curl --fail -s http://localhost:8000/api/v1/auth/token -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-admin-password"}' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          ID=$(curl --fail -s -X POST http://localhost:8000/api/v1/simulation/run -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"mode":"SCENARIO","scenario_rainfall_mm_hr":0.0}' | python -c 'import json,sys; print(json.load(sys.stdin)["simulation_id"])')
          for i in {1..60}; do STATUS=$(curl --fail -s http://localhost:8000/api/v1/simulation/$ID/status | python -c 'import json,sys; print(json.load(sys.stdin)["status"])'); test "$STATUS" = COMPLETED && exit 0; test "$STATUS" = FAILED && exit 1; sleep 2; done
          exit 1
      - if: always()
        run: docker compose logs --no-color > compose-integration.log; docker compose down -v
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-log
          path: backend/compose-integration.log
